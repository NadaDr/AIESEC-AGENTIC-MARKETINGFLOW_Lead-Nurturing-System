spring.application.name=mcp-tools-server
server.port=9090

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/aiesec_agentic_marketingflow?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# MCP Server
spring.ai.mcp.server.name=aiesec-socialflow-tools
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# EXPA API (URL w token mel environment variables, bla hardcode)
expa.api.url=${EXPA_API_URL:https://gis-api.aiesec.org/graphql}
expa.api.token=${EXPA_API_TOKEN:}
expa.api.page-size=100

# AIESEC.org API - Opportunities
aiesec.api.url=${AIESEC_API_URL:https://gis-api.aiesec.org/graphql}
aiesec.api.token=${AIESEC_API_TOKEN:}
aiesec.api.authorization-header=Authorization
aiesec.api.authorization-prefix=

# LNS Opportunity Synchronization (sync mta3 opportunities)
aiesec.opportunities.page-size=50
aiesec.opportunities.global-partner-page-size=50
aiesec.opportunities.max-pages=500
aiesec.opportunities.earliest-start-date=
aiesec.opportunities.exclude-home-mcs=


# Configuration SMTP (Gmail default; 7ot el env vars taht)
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email mta3 el sender el vérifié
app.mail.from=${MAIL_FROM:${MAIL_SMTP_USERNAME:no-reply@example.com}}

