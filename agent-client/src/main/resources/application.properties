# Application
spring.application.name=agent-client
server.port=8080

# Ollama
# llama3.2 is used here because it has reliable native tool-calling support
# in Ollama, which the exam's multi-tool orchestration requirement depends on.
# Pull it beforehand with: ollama pull llama3.2
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.0

# MCP Client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.aiesec-server.url=http://localhost:9090
spring.ai.mcp.client.streamable-http.connections.aiesec-server.endpoint=/mcp